#:schema https://jj-vcs.github.io/jj/latest/config-schema.json

[user]
name = "Joakim Gustin"
email = "jocke.gustin@gmail.com"
# Per-repo identity overrides live in conf.d/, which is gitignored.

[ui]
default-command = ["status"]
diff-formatter = ["difft", "--color=always", "$left", "$right"]

[aliases]
# Sync remote-tracking refs from origin
sync = ["util", "exec", "--", "jj-workflow", "sync"]
# Start a new empty working commit on top of latest main@origin
start = ["util", "exec", "--", "jj-workflow", "start"]
# Create or update a PR for the current change (auto-rebases onto main@origin)
pr = ["util", "exec", "--", "jj-workflow", "pr"]
# Edit the title/body of an existing PR (jj workspaces have no .git for `gh pr edit`)
"pr-edit" = ["util", "exec", "--", "jj-workflow", "pr-edit"]

# tug: bring nearest bookmark up to recent commit
tug = ['bookmark', 'move', '--from', 'heads(::@ & bookmarks())', '--to', 'closest_pushable(@)']
ll = ["log", "-T", "log_with_files"]

# float: rebase local/wip commits on top of current @
float = ["util", "exec", "--", "jj-float"]

# safe-push: push but error if local commits would be included.
# The trailing "jj-push" is $0 for `bash -c`. Without it the first real argument
# is consumed as $0, so `jj push -b master` reached jj as `jj git push master`.
push = ["util", "exec", "--", "bash", "-c", """
if jj log -r 'local() & ::@' --no-graph -T 'description.first_line() ++ "\n"' 2>/dev/null | grep -q .; then
  echo 'Error: refusing to push - local commits in ancestry:' >&2
  jj log -r 'local() & ::@' --no-graph -T 'description.first_line() ++ "\n"' >&2
  exit 1
fi
jj git push "$@"
""", "jj-push"]

# new-under: create new commit under local commits (inserts before them)
new-under = ["new", "--before", "roots(local())"]

# tidy: abandon empty, non-described commits (except working copies and merges)
tidy = ["abandon", "junk()"]

# retrunk: rebase current branch onto trunk
# Simplified to avoid floating local() commits which can mess up workspaces.
retrunk = ["rebase", "-d", "trunk()"]

[revset-aliases]
"closest_bookmark(to)" = "heads(::to & bookmarks())"
'closest_pushable(to)' = 'heads(::to & mutable() & ~description(exact:"") & (~empty() | merges()))'

# Local/WIP commits that should never be pushed
'local()' = '(description(glob:"local:*") | description(glob:"wip:*")) & mutable()'

# Empty, non-described commits that can be cleaned up.
# working_copies(), not @: every agent workspace has its own empty undescribed @,
# and abandoning those detaches the sibling workspace and drops its bookmark.
# bookmarks() guards a freshly created workspace, whose bookmark sits on an empty commit.
'junk()' = 'empty() & description(exact:"") & mutable() & ~working_copies() & ~merges() & ~bookmarks()'

[snapshot]
auto-update-stale = true

[templates]
git_push_bookmark = 'concat("gust1n/push-", change_id.short())'

# Agent sessions: no human can answer a prompt, so nothing may block on one.
# Keep this block last — every table below a `[--scope.*]` header would belong
# to the scope instead of the root.
#
# Agents run tools in a PTY (agy does; verified with isatty), so `ui.color` and
# `ui.paginate = "auto"` both see a terminal and behave as if a person is
# watching. `jj log` then starts `less -FRXK` against TERM=dumb and hangs on
# "Press RETURN to continue". agy exports PAGER=cat, but jj ignores PAGER by
# design and honors only JJ_PAGER or this setting.
#
# `--when.environments` matches NAME or NAME=VALUE, and any one entry is enough.
# TERM=dumb catches every harness that paints no UI of its own; the named
# markers catch the ones that keep a real TERM. Add a marker per harness.
[[--scope]]
--when.environments = [
  "TERM=dumb",
  "AI_AGENT",           # Claude Code, and any harness adopting the convention
  "CLAUDECODE",
  "ANTIGRAVITY_AGENT",  # agy
]
[--scope.ui]
paginate = "never"
# An editor here is a hang, not a prompt. `true` exits 0 leaving the message
# untouched, so `jj describe` without -m fails loudly instead of waiting.
editor = "true"
# TERM=dumb renders no ANSI, so color is noise in a transcript. diff-formatter
# has to be restated: --color=always in the root table would survive this.
color = "never"
diff-formatter = ["difft", "--color=never", "$left", "$right"]
