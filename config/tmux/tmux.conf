# -------------------------------------------------------------------
# Global options
# -------------------------------------------------------------------
# Clever trick to set PATH to be homebrew and mise aware.
run-shell 'NEW_PATH="$PATH"; [ -d "/opt/homebrew/bin" ] && NEW_PATH="/opt/homebrew/bin:$NEW_PATH"; [ -d "$HOME/.local/share/mise/shims" ] && NEW_PATH="$HOME/.local/share/mise/shims:$NEW_PATH"; tmux set-environment -g PATH "$NEW_PATH"'

# -------------------------------------------------------------------
# Session options
# -------------------------------------------------------------------
# Change prefix to ctrl-a (act like GNU screen)
unbind C-b
set -g prefix C-a
bind-key a send-prefix # Send C-a to applications by pressing it twice

# Set a shorter escape time for faster key sequences
set -sg escape-time 10

# Enable true color and cursor shape support for modern terminals
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'
set -g default-terminal "screen-256color"

# -------------------------------------------------------------------
# Window options
# -------------------------------------------------------------------
# Start window and pane numbering at 1 (handled by tmux-sensible, but explicit is fine)
set -g base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

# Use vi keybindings in copy mode
set-window-option -g mode-keys vi

# Enable mouse support
set -g mouse on

# Bell monitoring for agent notifications
set -g visual-bell off
set -g bell-action any


# -------------------------------------------------------------------
# Key bindings
# -------------------------------------------------------------------
# Create new windows and splits in the current path
bind-key c new-window -c "#{pane_current_path}"
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# Moving windows
bind-key -r > swap-window -t :+
bind-key -r < swap-window -t :-

# Pane switching (h,j,k,l are handled by vim-tmux-navigator)
bind-key tab select-pane -t :.+
bind-key btab select-pane -t :.-

# Switch to last pane
bind-key C-a last-pane

# Resize panes using PREFIX H, J, K, L
bind-key H resize-pane -L 5
bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key L resize-pane -R 5

# Reload tmux config
bind-key R source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded ~/.config/tmux/tmux.conf"

# Agent shortcuts
bind-key A display-popup -E -w 80% -h 80% "~/Code/dotfiles/bin/agent"
bind-key l run-shell "~/Code/dotfiles/bin/agent jump-next"

# Switch sessions by number (Alt+1..9, no prefix needed)
bind-key -n M-1 run-shell '~/Code/dotfiles/bin/agent-switch-session 1'
bind-key -n M-2 run-shell '~/Code/dotfiles/bin/agent-switch-session 2'
bind-key -n M-3 run-shell '~/Code/dotfiles/bin/agent-switch-session 3'
bind-key -n M-4 run-shell '~/Code/dotfiles/bin/agent-switch-session 4'
bind-key -n M-5 run-shell '~/Code/dotfiles/bin/agent-switch-session 5'
bind-key -n M-6 run-shell '~/Code/dotfiles/bin/agent-switch-session 6'
bind-key -n M-7 run-shell '~/Code/dotfiles/bin/agent-switch-session 7'
bind-key -n M-8 run-shell '~/Code/dotfiles/bin/agent-switch-session 8'
bind-key -n M-9 run-shell '~/Code/dotfiles/bin/agent-switch-session 9'

# Copy/paste bindings
bind-key Escape copy-mode
bind-key p paste-buffer
# Make copy mode behave (a little) like vim
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'V' send -X select-line
bind-key -T copy-mode-vi 'r' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel

# -------------------------------------------------------------------
# Bottom bar: Windows (classic setup, always visible)
# -------------------------------------------------------------------
set-option -g status-position bottom
set-option -g status-justify left
set-option -g status-bg colour238
set-option -g status-left ''
set-option -g status-left-length 0
set-option -g status-right '#[fg=yellow]#S #[fg=colour247]• #{cpu_fg_color}#(printf "\xef\x8b\x9b") #{cpu_percentage} #[fg=colour247]• #{ram_fg_color}#(printf "\xef\x88\xb3") #{ram_percentage} #[fg=colour247]• #{battery_status_fg}#(printf "\xef\x89\x80") #{battery_percentage} #[fg=colour247]• #[fg=magenta]%d %b %H:%M'
set-option -g status-right-length 100
set-option -g status-interval 5
set-window-option -g window-status-format '#[bg=colour238]#[fg=colour247] #I #W '
set-window-option -g window-status-current-format '#[bg=colour235]#[fg=green] #I #W#F '

set-option -g pane-active-border-style 'fg=colour238'
set-option -g pane-border-style 'fg=colour238'

# -------------------------------------------------------------------
# Top bar: Session tabs (via pane-border-status, auto-hides with 1 session)
# -------------------------------------------------------------------
set-option -g pane-border-status top
set-option -g pane-border-format '#{?#{==:#{pane_index},1},#(~/Code/dotfiles/bin/agent-session-bar),}'

# Stale agent check piggybacks on pane-border-format refresh (status-interval)
# Session toggle hooks
set-hook -g session-created 'run-shell -b "~/Code/dotfiles/bin/agent-session-toggle"'
set-hook -g session-closed 'run-shell -b "~/Code/dotfiles/bin/agent-session-toggle"'

# -------------------------------------------------------------------
# Plugins
# -------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'wfxr/tmux-fzf-url'

# -- Plugin settings
# CPU color thresholds
set -g @cpu_color_low "green"
set -g @cpu_color_medium "yellow"
set -g @cpu_color_high "red"

# Battery status colors
set -g @batt_color_charged_fg "green"
set -g @batt_color_charging_fg "yellow"
set -g @batt_color_discharging_fg "colour247"

set -g @extrakto_split_direction "v"
set -g @extrakto_grab_area "window full"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
