# herdr configuration: only values that differ from the defaults.
# Validate with `herdr config check`.
onboarding = false

[theme]
name = "one-dark"

[keys]
prefix = "ctrl+a"
focus_agent = "prefix+alt+1..9"
toggle_sidebar = "prefix+b"
# prefix+shift+a/d/y drive herdr-jj below. herdr's new_worktree and
# remove_worktree are git-only and a jj repo does not track them, so they stay
# unset.

# --- jj-workspace agents (bin/herdr-jj) ------------------------------------

# New or attach: pick a repo, then one ranked list — running agents, idle
# workspaces, your local bookmarks by recency, then everyone else's. Selecting a
# workspace attaches to it; a bookmark branches a new one off it; typing a fresh
# name starts new work.
[[keys.command]]
key = "prefix+shift+a"
type = "popup"
command = "herdr-jj new"
width = "80%"
height = "70%"

# Same key as herdr's native close_workspace, and it keeps that meaning:
#   in an agent workspace -> jj workspace forget + delete + close in herdr
#                            (prompts first if it holds unpushed commits)
#   anywhere else         -> plain "close this herdr workspace"
[[keys.command]]
key = "prefix+shift+d"
type = "popup"
command = "herdr-jj rm"
width = "70%"
height = "40%"

# Sweep dead workspaces and divergent commits left by finished agents.
[[keys.command]]
key = "prefix+shift+y"
type = "popup"
command = "herdr-jj tidy"
width = "70%"
height = "60%"

# URL picker: extract and open URLs from the current pane's scrollback.
[[keys.command]]
key = "prefix+shift+u"
type = "popup"
command = "herdr-url-picker"
width = "80%"
height = "60%"
description = "URL Picker"

# jj status overlay — quick repo state without leaving the current pane.
[[keys.command]]
key = "prefix+shift+j"
type = "popup"
command = "jj-status-popup"
width = "85%"
height = "85%"
description = "jj Status"

# Agent rows: icon + workspace, then the agent. The state icon shows
# idle/working, so no state_text row.
[ui.sidebar.agents]
rows = [["state_icon", "workspace"], ["agent"]]

# Claude: the task title is more useful than "claude" on row 2.
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "workspace"], ["terminal_title_stripped"]]

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.sound]
enabled = false

[experimental]
pane_history = false
